services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: networking
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-networking}
      POSTGRES_DB: networking
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U networking"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://networking:${POSTGRES_PASSWORD:-networking}@db:5432/networking
      AI_PROVIDER: ${AI_PROVIDER:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-claude-opus-4-8}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
      APP_USERNAME: ${APP_USERNAME:-admin}
      APP_PASSWORD: ${APP_PASSWORD:-}
      API_KEY: ${API_KEY:-}
      DAILY_SUGGESTIONS: ${DAILY_SUGGESTIONS:-5}
      UPCOMING_WINDOW_DAYS: ${UPCOMING_WINDOW_DAYS:-14}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8000/api/integrations/google/callback}
      SYNC_WINDOW_DAYS: ${SYNC_WINDOW_DAYS:-120}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-false}
      DAILY_RUN_HOUR: ${DAILY_RUN_HOUR:-8}
      DIGEST_EMAIL_TO: ${DIGEST_EMAIL_TO:-}
      SCRAPER_PROVIDER: ${SCRAPER_PROVIDER:-}
      SCRAPER_API_KEY: ${SCRAPER_API_KEY:-}
      SYNC_AI_SENTIMENT: ${SYNC_AI_SENTIMENT:-true}
      CHATER_DATABASE_URL: ${CHATER_DATABASE_URL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      BACKGROUND_AI: ${BACKGROUND_AI:-api}
      BACKGROUND_AI_FALLBACK: ${BACKGROUND_AI_FALLBACK:-api}
    ports:
      - "${WEB_PORT:-8000}:8000"

  # Telegram bot + Business proxy (drafts, send-as-user). Idles until
  # TELEGRAM_POLLING_ENABLED=true — flip it only after the old Chater
  # poller is stopped (one getUpdates consumer per token).
  bot:
    build: .
    command: python -m app.run_bot
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://networking:${POSTGRES_PASSWORD:-networking}@db:5432/networking
      AI_PROVIDER: ${AI_PROVIDER:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-claude-opus-4-8}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_POLLING_ENABLED: ${TELEGRAM_POLLING_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      SYNC_AI_SENTIMENT: ${SYNC_AI_SENTIMENT:-true}
      BACKGROUND_AI: ${BACKGROUND_AI:-api}
      BACKGROUND_AI_FALLBACK: ${BACKGROUND_AI_FALLBACK:-api}
      # ALiSiO CRM: business_message спершу летить їй; handled>0 — чат її.
      ALISIO_WEBHOOK_URL: ${ALISIO_WEBHOOK_URL:-https://alisio.rozum.one/api/webhooks/crm/telegram}
      ALISIO_WEBHOOK_SECRET: ${ALISIO_WEBHOOK_SECRET:-}

  # Фоновий AI на підписці: Claude Code CLI бере задачі з черги ai_jobs і
  # працює через наш MCP. Без CLAUDE_CODE_OAUTH_TOKEN просто спить.
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://networking:${POSTGRES_PASSWORD:-networking}@db:5432/networking
      BACKGROUND_AI: ${BACKGROUND_AI:-api}
      BACKGROUND_AI_FALLBACK: ${BACKGROUND_AI_FALLBACK:-api}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      CLAUDE_CODE_MODEL: ${CLAUDE_CODE_MODEL:-sonnet}
      MCP_INTERNAL_URL: ${MCP_INTERNAL_URL:-http://web:8000}
      AIJOBS_MAX_PER_HOUR: ${AIJOBS_MAX_PER_HOUR:-40}
      AIJOBS_QUIET_HOURS: ${AIJOBS_QUIET_HOURS:-}
      # Для відкату на API і для повідомлень власнику.
      AI_PROVIDER: ${AI_PROVIDER:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-claude-opus-4-8}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}

volumes:
  pgdata:
